[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "coremlmath"
version = "0.1.0"
description = "A multithreaded C++ backend for high-performance Machine Learning Math"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Kartavya Shukla", email = "kartavyashuklahardoi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["numpy"]
keywords = [
    "machine-learning", 
    "math", 
    "c++", 
    "pybind11", 
    "multithreading", 
    "android", 
    "linux", 
    "windows"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX", 
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/Novfensec/coremlmath"
Repository = "https://github.com/Novfensec/coremlmath.git"
"Bug Tracker" = "https://github.com/Novfensec/coremlmath/issues"

[tool.scikit-build]
cmake.version = ">=3.15"
ninja.version = ">=1.5"
wheel.install-dir = "cmlmath"
wheel.packages = ["src/cmlmath"]